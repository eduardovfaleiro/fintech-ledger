<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Tempo da consulta por volume de transações</title>
  <desc id="desc">Dois gráficos mostram o crescimento do tempo sem índice e a estabilidade do tempo com índice em um, dez e cinquenta milhões de transações.</desc>
  <rect width="960" height="480" rx="16" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Tempo da consulta por volume de transações</text>

  <g transform="translate(60 72)">
    <rect width="390" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="195" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#be123c">Sem índice</text>
    <text x="18" y="55" font-family="sans-serif" font-size="11" fill="#64748b">ms</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="52" y1="70" x2="368" y2="70"/>
      <line x1="52" y1="137.5" x2="368" y2="137.5"/>
      <line x1="52" y1="205" x2="368" y2="205"/>
      <line x1="52" y1="272.5" x2="368" y2="272.5"/>
      <line x1="52" y1="340" x2="368" y2="340"/>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">
      <text x="45" y="74">1.200</text>
      <text x="45" y="141.5">900</text>
      <text x="45" y="209">600</text>
      <text x="45" y="276.5">300</text>
      <text x="45" y="344">0</text>
    </g>
    <polyline points="100,323.7 210,275.6 330,81.7" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#e11d48" stroke="#ffffff" stroke-width="3">
      <circle cx="100" cy="323.7" r="7"/>
      <circle cx="210" cy="275.6" r="7"/>
      <circle cx="330" cy="81.7" r="7"/>
    </g>
    <g font-family="sans-serif" font-size="11" font-weight="700" fill="#881337" text-anchor="middle">
      <text x="100" y="309">72,403</text>
      <text x="210" y="260">286,406</text>
      <text x="330" y="70">1.148,094</text>
    </g>
    <g font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">
      <text x="100" y="365">1M</text>
      <text x="210" y="365">10M</text>
      <text x="330" y="365">50M</text>
    </g>
  </g>

  <g transform="translate(510 72)">
    <rect width="390" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="195" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#047857">Com índice</text>
    <text x="18" y="55" font-family="sans-serif" font-size="11" fill="#64748b">ms</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="52" y1="70" x2="368" y2="70"/>
      <line x1="52" y1="137.5" x2="368" y2="137.5"/>
      <line x1="52" y1="205" x2="368" y2="205"/>
      <line x1="52" y1="272.5" x2="368" y2="272.5"/>
      <line x1="52" y1="340" x2="368" y2="340"/>
    </g>
    <g font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">
      <text x="45" y="74">0,300</text>
      <text x="45" y="141.5">0,225</text>
      <text x="45" y="209">0,150</text>
      <text x="45" y="276.5">0,075</text>
      <text x="45" y="344">0</text>
    </g>
    <polyline points="100,101.0 210,150.5 330,157.8" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#059669" stroke="#ffffff" stroke-width="3">
      <circle cx="100" cy="101.0" r="7"/>
      <circle cx="210" cy="150.5" r="7"/>
      <circle cx="330" cy="157.8" r="7"/>
    </g>
    <g font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">
      <text x="100" y="87">0,266</text>
      <text x="210" y="136">0,211</text>
      <text x="330" y="180">0,202</text>
    </g>
    <g font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">
      <text x="100" y="365">1M</text>
      <text x="210" y="365">10M</text>
      <text x="330" y="365">50M</text>
    </g>
  </g>

  <text x="480" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Escalas verticais diferentes para tornar visíveis as duas séries.</text>
</svg>
