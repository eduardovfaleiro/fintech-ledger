name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run static analysis
        run: make lint PYTHON=python

      - name: Check formatting
        run: make format-check PYTHON=python

  integration:
    name: Integration and benchmark smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: fintech_ledger
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Create schema and CI data set
        run: |
          make schema DB_PORT=5432 PYTHON=python
          make generate-data DB_PORT=5432 PYTHON=python N_ACCOUNTS=5000 N_COUNTERPARTIES=500 N_TRANSACTIONS=50000
          make indexes DB_PORT=5432 PYTHON=python

      - name: Run integration tests
        run: make test DB_PORT=5432 PYTHON=python

      - name: Exercise N+1 benchmark
        run: >-
          python benchmarks/benchmark_n_plus_one.py
          --account-id 47
          --page-size 10
          --executions 3
          --warmup 1
          --output /tmp/n-plus-one-smoke.json

      - name: Exercise scale benchmark
        run: >-
          python benchmarks/benchmark_scale.py
          --scales 10000 50000 100000
          --executions 2
          --warmup 1
          --output /tmp/scale-smoke.json

      - name: Exercise concurrent queue benchmark
        run: >-
          python benchmarks/benchmark_skip_locked.py
          --jobs 100
          --workers 2
          --batch-size 10
          --processing-delay-ms 1
          --executions 3
          --warmup 1
          --output /tmp/skip-locked-smoke.json
