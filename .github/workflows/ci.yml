name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Create schema and CI data set
        run: |
          make schema DB_PORT=5432 PYTHON=python
          make generate-data DB_PORT=5432 PYTHON=python N_ACCOUNTS=5000 N_COUNTERPARTIES=500 N_TRANSACTIONS=50000
          make indexes DB_PORT=5432 PYTHON=python

      - name: Run integration tests
        run: make test DB_PORT=5432 PYTHON=python

      - name: Exercise concurrent queue
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: fintech_ledger
          PGUSER: postgres
          PGPASSWORD: postgres
        run: >-
          python benchmarks/benchmark_skip_locked.py
          --jobs 100
          --workers 2
          --batch-size 10
          --processing-delay-ms 1
          --executions 3
          --warmup 1
          --output /tmp/skip-locked-smoke.json
